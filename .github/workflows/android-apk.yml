name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/mobile-purchase-android-v1"]
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-apk.yml"
      - "backend/app/database.py"
      - "backend/app/purchase_receipts.py"
      - "launcher.py"

concurrency:
  group: oc11-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OC11-NhapHang-APK
          path: mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
