name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: oc11-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install manager web dependencies
        working-directory: manager-web
        run: npm install

      - name: Build manager web
        working-directory: manager-web
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Build OC11.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OC11 --add-data "manager-web/dist;static" launcher.py

      - name: Smoke test OC11.exe
        shell: pwsh
        run: |
          $env:OC11_NO_BROWSER = "1"
          $env:OC11_NO_STARTUP_REGISTER = "1"
          $process = Start-Process -FilePath "dist/OC11.exe" -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
              }
            }

            if (-not $healthy) {
              throw "OC11.exe did not become healthy."
            }

            $backup = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/backup/status" -TimeoutSec 5
            if (-not $backup.folder) {
              throw "Backup API did not return a backup folder."
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable/OC11-Portable/data" | Out-Null
          Copy-Item "dist/OC11.exe" "portable/OC11-Portable/OC11.exe"

          @"
          OC11 Portable
          =============

          Cach dung:
          1. Giai nen file OC11-Portable.zip vao mot thu muc tren Windows.
          2. Chay OC11.exe.
          3. Trinh duyet se tu mo trang quan ly tai http://127.0.0.1:8000

          Du lieu:
          - Database chinh nam tai data/oc11.db.
          - Khong xoa thu muc data khi cap nhat phien ban.

          Sao luu Google Drive:
          - Cai Google Drive for desktop tren may.
          - Vao OC11 > Cai dat > Sao luu du lieu.
          - Bam "Chon thu muc Google Drive".
          - Chon thu muc nam trong Google Drive.
          - OC11 se tu tao OC11_Backup va sao luu sau moi lan ghi du lieu.
          - oc11_latest.db la ban moi nhat.
          - oc11_YYYY-MM-DD.db la ban theo ngay.

          Khoi dong cung Windows:
          - Sau khi chay OC11.exe mot lan, ung dung tu dang ky vao Startup Apps.
          - Khi Windows dang nhap, OC11 chay ngam va khong tu mo trinh duyet.
          - Khi can dung, bam OC11.exe; neu server dang chay, trinh duyet se mo ngay.

          Cap nhat:
          - Tai ban OC11-Portable.zip moi.
          - Chay OC11.exe ban moi.
          - Ban moi se tu dong dong OC11.exe cu neu no dang chiem cong 8000.
          - GIU NGUYEN thu muc data/oc11.db khi thay file OC11.exe.
          "@ | Set-Content -Encoding UTF8 "portable/OC11-Portable/HUONG-DAN.txt"

          @"
          Thu muc nay chua database cua OC11.
          File oc11.db se tu duoc tao khi chay OC11.exe lan dau.
          settings.json luu cau hinh sao luu.
          Khong xoa cac file nay khi cap nhat ung dung.
          "@ | Set-Content -Encoding UTF8 "portable/OC11-Portable/data/README.txt"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OC11-Portable
          path: portable/OC11-Portable/
          if-no-files-found: error
          retention-days: 30
