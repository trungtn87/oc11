name: Build Windows Portable

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "manager-web/**"
      - "launcher.py"
      - "pos_launcher.py"
      - ".github/workflows/portable.yml"
  push:
    branches: ["main"]

concurrency:
  group: oc11-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install manager web dependencies
        working-directory: manager-web
        run: npm install

      - name: Build manager web
        working-directory: manager-web
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Build OC11.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OC11 --add-data "manager-web/dist;static" launcher.py

      - name: Build OC11-POS.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OC11-POS pos_launcher.py

      - name: Smoke test OC11.exe
        shell: pwsh
        run: |
          $env:OC11_NO_BROWSER = "1"
          $env:OC11_NO_STARTUP_REGISTER = "1"
          $process = Start-Process -FilePath "dist/OC11.exe" -PassThru -WindowStyle Hidden
          $runtimePid = $null
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
              }
            }

            if (-not $healthy) {
              throw "OC11.exe did not become healthy."
            }

            $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/runtime" -TimeoutSec 5
            $runtimePid = [int]$runtime.pid

            $backup = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/backup/status" -TimeoutSec 5
            if (-not $backup.folder) {
              throw "Backup API did not return a backup folder."
            }
          } finally {
            if ($runtimePid) {
              Stop-Process -Id $runtimePid -Force -ErrorAction SilentlyContinue
            }
            if ($process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
            Start-Sleep -Seconds 1
          }

      - name: Smoke test upgrade takeover
        shell: pwsh
        run: |
          @'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/openapi.json":
                      body = json.dumps({"info": {"title": "OC11 API"}}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  if self.path == "/api/health":
                      body = json.dumps({"status": "ok"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  pass

          HTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
          '@ | Set-Content -Encoding UTF8 "legacy-oc11.py"

          $env:OC11_NO_BROWSER = "1"
          $env:OC11_NO_STARTUP_REGISTER = "1"
          $legacy = Start-Process -FilePath "python" -ArgumentList "legacy-oc11.py" -PassThru -WindowStyle Hidden
          $current = $null
          $currentRuntimePid = $null

          try {
            $legacyReady = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $openapi = Invoke-RestMethod -Uri "http://127.0.0.1:8000/openapi.json" -TimeoutSec 2
                if ($openapi.info.title -eq "OC11 API") {
                  $legacyReady = $true
                  break
                }
              } catch {
              }
            }

            if (-not $legacyReady) {
              throw "Legacy OC11 test server did not start."
            }

            $current = Start-Process -FilePath "dist/OC11.exe" -PassThru -WindowStyle Hidden
            $takenOver = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/runtime" -TimeoutSec 2
                if ($runtime.app -eq "OC11" -and [int]$runtime.pid -ne $legacy.Id) {
                  $currentRuntimePid = [int]$runtime.pid
                  $takenOver = $true
                  break
                }
              } catch {
              }
            }

            if (-not $takenOver) {
              throw "New OC11.exe did not take over port 8000 from a legacy OC11 instance."
            }

            $legacy.Refresh()
            if (-not $legacy.HasExited) {
              throw "Legacy OC11 process is still running after takeover."
            }
          } finally {
            if ($currentRuntimePid) {
              Stop-Process -Id $currentRuntimePid -Force -ErrorAction SilentlyContinue
            }
            if ($current) {
              $current.Refresh()
              if (-not $current.HasExited) {
                Stop-Process -Id $current.Id -Force -ErrorAction SilentlyContinue
              }
            }
            $legacy.Refresh()
            if (-not $legacy.HasExited) {
              Stop-Process -Id $legacy.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item "legacy-oc11.py" -ErrorAction SilentlyContinue
          }

      - name: Create portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable/OC11-Portable/data" | Out-Null
          Copy-Item "dist/OC11.exe" "portable/OC11-Portable/OC11.exe"
          Copy-Item "dist/OC11-POS.exe" "portable/OC11-Portable/OC11-POS.exe"

          @"
          OC11 Portable
          =============

          Cach dung:
          1. Giai nen file OC11-Portable.zip vao mot thu muc tren Windows.
          2. Chay OC11.exe de mo trang quan ly.
          3. Chay OC11-POS.exe de mo app ban hang PC. POS se tu khoi dong OC11.exe ngam neu backend chua chay.
          4. POS dung bo cuc Order / So do / Ban hang va dung chung database voi web quan ly.

          Gui bep:
          - Vao Web quan ly > Cai dat > May in bep.
          - Chon may in Windows va bam In thu.
          - Tren POS bam "Gui bep" de in bill mon xuong bep.

          Du lieu:
          - Database chinh nam tai data/oc11.db.
          - Khong xoa thu muc data khi cap nhat phien ban.

          Sao luu Google Drive:
          - Cai Google Drive for desktop tren may.
          - Vao OC11 > Cai dat > Sao luu du lieu.
          - Bam "Chon thu muc Google Drive".
          - Chon thu muc nam trong Google Drive.
          - OC11 se tu tao OC11_Backup va sao luu sau moi lan ghi du lieu.
          - oc11_latest.db la ban moi nhat.
          - oc11_YYYY-MM-DD.db la ban theo ngay.

          Khoi dong cung Windows:
          - Sau khi chay OC11.exe mot lan, ung dung tu dang ky vao Startup Apps.
          - Khi Windows dang nhap, OC11 chay ngam va khong tu mo trinh duyet.
          - Khi can dung, bam OC11.exe; neu server dang chay, trinh duyet se mo ngay.

          Cap nhat:
          - Tai ban OC11-Portable.zip moi.
          - Khong can vao Task Manager de dong ban cu.
          - Chay OC11.exe ban moi; ban moi se nhan dien va tu thay the OC11 cu dang chiem cong 8000.
          - Neu OC11 da la dung ban moi, bam OC11.exe chi mo giao dien, khong khoi dong server lan 2.
          - GIU NGUYEN thu muc data/oc11.db khi thay file OC11.exe.
          "@ | Set-Content -Encoding UTF8 "portable/OC11-Portable/HUONG-DAN.txt"

          @"
          Thu muc nay chua database cua OC11.
          File oc11.db se tu duoc tao khi chay OC11.exe lan dau.
          settings.json luu cau hinh sao luu.
          Khong xoa cac file nay khi cap nhat ung dung.
          "@ | Set-Content -Encoding UTF8 "portable/OC11-Portable/data/README.txt"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OC11-Portable
          path: portable/OC11-Portable/
          if-no-files-found: error
          retention-days: 30
