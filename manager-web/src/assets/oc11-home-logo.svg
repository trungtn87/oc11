<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 112" role="img" aria-labelledby="title desc">
  <title id="title">Logo Ốc 11</title>
  <desc id="desc">Logo vàng trắng của quán Ốc 11 như trên trang Tổng quan</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d06b"/>
      <stop offset=".58" stop-color="#e4ad3e"/>
      <stop offset="1" stop-color="#bd7f1f"/>
    </linearGradient>
  </defs>

  <!-- crown -->
  <path d="M45 13 50 4l6 7 8-9 7 10 7-7 3 11c-12-3-24-3-36-1Z"
        fill="url(#gold)"/>
  <circle cx="50" cy="4" r="2.2" fill="#f7cf69"/>
  <circle cx="64" cy="2.5" r="2.2" fill="#f7cf69"/>
  <circle cx="78" cy="5" r="2.2" fill="#f7cf69"/>

  <!-- stylised snail / Ốc mark -->
  <path d="M28 64c0-23 15-39 35-39 18 0 31 12 31 28 0 14-10 25-24 25H49c-13 0-23-8-23-19 0-10 8-18 18-18 9 0 16 6 16 14 0 7-5 12-11 12-5 0-9-3-9-8 0-4 3-7 7-7"
        fill="none" stroke="url(#gold)" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M23 79c20 6 45 6 67 0M30 88c17 5 36 5 54 0"
        fill="none" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M83 65c8 0 14 5 16 12" fill="none" stroke="url(#gold)"
        stroke-width="4.2" stroke-linecap="round"/>

  <!-- wordmark is inside the image asset, not separate UI text -->
  <text x="103" y="57" font-family="Georgia, 'Times New Roman', serif"
        font-size="41" font-weight="700" fill="#fff">Ốc</text>
  <text x="174" y="57" font-family="Georgia, 'Times New Roman', serif"
        font-size="41" font-weight="700" fill="url(#gold)">11</text>

  <text x="104" y="77" font-family="Arial, Helvetica, sans-serif"
        font-size="11.5" font-weight="600" fill="#eef5ff">Ăn hải sản trên núi</text>
  <text x="104" y="93" font-family="Arial, Helvetica, sans-serif"
        font-size="11.5" font-weight="600" fill="#eef5ff">chất lượng như ở biển</text>
</svg>